[graph]
targets = []
all-features = true

[advisories]
version = 2
yanked = "deny"
# Chrono maintenance only; expiry/scope checked by advisory_exception_check.py.
# Owner: SednaLabs maintainers. Ops w19008. Expires 2026-12-18 00:00 UTC.
ignore = ["RUSTSEC-2026-0543"]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[[licenses.exceptions]]
# sqlparser -> recursive -> stacker -> psm build dependency. See governance docs.
name = "ar_archive_writer"
version = "=0.5.5"
allow = ["Apache-2.0 WITH LLVM-exception"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/sednalabs/mcp-toolkit-rs",
  "https://github.com/sednalabs/rust-sdk",
]
