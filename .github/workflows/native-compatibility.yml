name: native-compatibility

on:
  pull_request:
    branches:
      - main

concurrency:
  group: native-compatibility::${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-native:
    name: Check ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    env:
      BINARY_NAME: redshift-mcp
      TARGET: ${{ matrix.target }}
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Checkout pull request
        # actions/checkout v6
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Isolate Rustup state on macOS runners
        if: runner.os == 'macOS'
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain 1.99.0 (the Toolkit compatibility floor)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.0

      - name: Verify native target
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET"

      - name: Cache cargo artifacts
        # swatinem/rust-cache v2
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: native-compatibility-${{ matrix.target }}

      - name: Build locked native binary
        shell: bash
        run: cargo build --release --locked --target "$TARGET" --bin "$BINARY_NAME"

      - name: Verify offline tool inventory and schema
        shell: bash
        run: |
          set -euo pipefail
          binary_path="target/$TARGET/release/$BINARY_NAME"
          if [[ "$TARGET" == *windows* ]]; then binary_path+=".exe"; fi
          mkdir -p native-compatibility
          python3 scripts/native_release_artifact.py capture \
            --binary "$binary_path" \
            --inventory-output native-compatibility/tool-inventory.json \
            --schema-output native-compatibility/tool-schema.json
